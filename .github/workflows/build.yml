Name: Build Android APK

On:
  Push:
    Branches: [ «main», «master» ]
  Workflow_dispatch:

Jobs:
  Build:
    Name: Generate APK
    Runs-on: ubuntu-latest

    Steps:
      - name: Checkout Code
        Uses: actions/checkout@v4

      - name: Setup Java 17
        Uses: actions/setup-java@v4
        With:
          Distribution: 'temurin'
          Java-version: '17'

      - name: Initialize Android Wrapper Project
        Run: |
          # Создаем структуру проекта
          Mkdir -p app/src/main/assets app/src/main/res/values app/src/main/java/ru/repin/ohotnik

          # Копируем наш файл приложения
          Cp index.html app/src/main/assets/index.html

          # Настройки репозиториев
          Cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  google()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = «OhotnikKuzbass»
          include ':app'
          EOF

          # Корневой build.gradle
          Cat << 'EOF' > build.gradle
          Plugins {
              Id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          # Сборка модуля app
          Cat << 'EOF' > app/build.gradle
          Plugins {
              Id 'com.android.application'
          }
          Android {
              Namespace 'ru.repin.ohotnik'
              compileSdk 34
              defaultConfig {
                  applicationId «ru.repin.ohotnik»
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName «1.0»
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          Dependencies {
              Implementation 'androidx.appcompat:appcompat:1.6.1'
              Implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          # Манифест с разрешениями на геолокацию
          Cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version=»1.0» encoding=»utf-8»?>
          <manifest xmlns:android=»http://schemas.android.com/apk/res/android»>
              <uses-permission android:name=»android.permission.INTERNET» />
              <uses-permission android:name=»android.permission.ACCESS_FINE_LOCATION» />
              <uses-permission android:name=»android.permission.ACCESS_COARSE_LOCATION» />
              <application
                  Android:allowBackup=»true»
                  Android:label=»Охотник Кузбасса»
                  Android:theme=»@style/Theme.AppCompat.NoActionBar»>
                  <activity
                      Android:name=».MainActivity»
                      Android:exported=»true»>
                      <intent-filter>
                          <action android:name=»android.intent.action.MAIN» />
                          <category android:name=»android.intent.category.LAUNCHER» />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Java Activity
          Cat << 'EOF' > app/src/main/java/ru/repin/ohotnik/MainActivity.java
          Package ru.repin.ohotnik;
          Import android.os.Bundle;
          Import android.webkit.WebChromeClient;
          Import android.webkit.WebSettings;
          Import android.webkit.WebView;
          Import android.webkit.WebViewClient;
          Import androidx.appcompat.app.AppCompatActivity;

          Public class MainActivity extends AppCompatActivity {
              Private WebView myWebView;
              @Override
              Protected void onCreate(Bundle savedInstanceState) {
                  Super.onCreate(savedInstanceState);
                  myWebView = new WebView(this);
                  setContentView(myWebView);
                  WebSettings webSettings = myWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setGeolocationEnabled(true);
                  myWebView.setWebViewClient(new WebViewClient());
                  myWebView.setWebChromeClient(new WebChromeClient());
                  myWebView.loadUrl(«file:///android_asset/index.html»);
              }
              @Override
              Public void onBackPressed() {
                  If (myWebView.canGoBack()) {
                      myWebView.goBack();
                  } else {
                      Super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        Uses: gradle/actions/setup-gradle@v3
        With:
          Gradle-version: '8.4'

      - name: Compile Debug APK
        Run: gradle assembleDebug –no-daemon

      - name: Save APK Artifact
        Uses: actions/upload-artifact@v4
        With:
          Name: OhotnikKuzbass-APK
          Path: app/build/outputs/apk/debug/app-debug.apk


