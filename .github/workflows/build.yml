name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble Native Android Project
        run: |
          mkdir -p OhotnikKuzbass/app/src/main/assets
          mkdir -p OhotnikKuzbass/app/src/main/java/ru/repin/ohotnik
          mkdir -p OhotnikKuzbass/app/src/main/res/values

          # Переносим HTML-код приложения
          cp index.html OhotnikKuzbass/app/src/main/assets/index.html

          # settings.gradle
          cat << 'EOF' > OhotnikKuzbass/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OhotnikKuzbass"
          include ':app'
          EOF

          # Корневой build.gradle
          cat << 'EOF' > OhotnikKuzbass/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # Модульный app/build.gradle
          cat << 'EOF' > OhotnikKuzbass/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'ru.repin.ohotnik'
              compileSdk 34
              defaultConfig {
                  applicationId "ru.repin.ohotnik"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { debuggable true }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > OhotnikKuzbass/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:label="Охотник Кузбасса"
                  android:theme="@style/Theme.OhotnikKuzbass">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Стили
          cat << 'EOF' > OhotnikKuzbass/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.OhotnikKuzbass" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:statusBarColor">#0a0d0c</item>
                  <item name="android:navigationBarColor">#0a0d0c</item>
                  <item name="android:windowBackground">#0a0d0c</item>
              </style>
          </resources>
          EOF

          # Java-обёртка
          cat << 'EOF' > OhotnikKuzbass/app/src/main/java/ru/repin/ohotnik/MainActivity.java
          package ru.repin.ohotnik;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static final int LOCATION_REQ = 101;
              private GeolocationPermissions.Callback geoCallback;
              private String geoOrigin;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setGeolocationEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setLoadsImagesAutomatically(true);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                              geoCallback = callback;
                              geoOrigin = origin;
                              ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, LOCATION_REQ);
                          } else {
                              callback.invoke(origin, true, false);
                          }
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("https://yandex.ru/maps") || url.startsWith("https://2gis.ru") || url.startsWith("tel:") || url.startsWith("mailto:")) {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == LOCATION_REQ && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      if (geoCallback != null) geoCallback.invoke(geoOrigin, true, false);
                  } else {
                      if (geoCallback != null) geoCallback.invoke(geoOrigin, false, false);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd OhotnikKuzbass
          gradle assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: OhotnikKuzbass-APK
          path: OhotnikKuzbass/app/build/outputs/apk/debug/app-debug.apk
